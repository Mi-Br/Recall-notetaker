[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-notetaker"
version = "0.1.0"
description = "Personal Google Meet notetaker: Recall.ai bot + Claude notes"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.50",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
notetaker = "recall_notetaker.cli:main"
notetaker-mcp = "recall_notetaker.mcp_server:main"

[tool.setuptools.packages.find]
include = ["recall_notetaker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
