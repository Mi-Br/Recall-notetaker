<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- "Angela", Werkzet's notetaker. Original design: rim-lit profile over a planet horizon. -->
  <defs>
    <radialGradient id="space" cx="0.3" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#0e1424"/><stop offset="1" stop-color="#03050a"/>
    </radialGradient>
    <radialGradient id="atmo" cx="0.5" cy="1.9" r="1.35">
      <stop offset="0.80" stop-color="#05070d"/>
      <stop offset="0.86" stop-color="#0b2a4a"/>
      <stop offset="0.885" stop-color="#3fa9ff" stop-opacity="0.85"/>
      <stop offset="0.9" stop-color="#bfe6ff" stop-opacity="0.9"/>
      <stop offset="0.93" stop-color="#3fa9ff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#03050a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#2a3446"/><stop offset="0.35" stop-color="#151b27"/><stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="hair" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2232"/><stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0d14"/><stop offset="1" stop-color="#1b2233"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1280" height="720" fill="url(#space)"/>
  <g fill="#cfe3ff">
    <circle cx="80" cy="70" r="1.4"/><circle cx="180" cy="190" r="1"/><circle cx="640" cy="60" r="1.2"/>
    <circle cx="760" cy="150" r="0.9"/><circle cx="980" cy="80" r="1.5"/><circle cx="1210" cy="140" r="1"/>
    <circle cx="1120" cy="40" r="0.8"/><circle cx="880" cy="210" r="0.8"/><circle cx="560" cy="120" r="0.7"/>
    <circle cx="1240" cy="300" r="1.1"/><circle cx="60" cy="380" r="0.9"/>
  </g>
  <!-- planet horizon -->
  <rect width="1280" height="720" fill="url(#atmo)"/>

  <!-- HUD rings around the head -->
  <g fill="none" stroke="#5fb8ff" stroke-opacity="0.35" stroke-width="1.5">
    <circle cx="390" cy="300" r="235"/>
    <path d="M390 40 A260 260 0 0 1 640 230" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M150 420 A260 260 0 0 1 135 250" stroke-opacity="0.5"/>
  </g>
  <g stroke="#5fb8ff" stroke-opacity="0.55" stroke-width="2">
    <path d="M390 58 v14"/><path d="M622 300 h-14"/><path d="M158 300 h14"/>
  </g>

  <!-- figure -->
  <g>
    <!-- body / high-collar suit -->
    <path d="M300 470 C330 448 345 430 348 405 L430 412 C432 440 440 462 470 480 C540 515 600 560 640 720 L150 720 C165 600 220 520 300 470 Z" fill="url(#suit)"/>
    <path d="M318 468 C350 452 372 440 380 420 L428 424 C434 448 448 462 470 478" fill="none" stroke="#5fb8ff" stroke-opacity="0.5" stroke-width="2"/>
    <!-- neck -->
    <path d="M348 360 L352 412 C380 425 410 425 430 414 L428 395 Z" fill="#111722"/>
    <!-- face in profile, facing right -->
    <path id="face" d="M418 150 C462 158 488 192 492 232 C494 252 500 266 513 290 C518 299 513 306 501 309 C497 314 499 320 501 326 C506 333 501 340 494 343 C500 351 498 359 490 363 C486 373 488 383 478 396 C464 410 440 415 424 418 C400 420 375 410 360 395 L340 250 C350 190 380 155 418 150 Z" fill="url(#skin)"/>
    <!-- rim light on the profile edge -->
    <path d="M418 150 C462 158 488 192 492 232 C494 252 500 266 513 290 C518 299 513 306 501 309 C497 314 499 320 501 326 C506 333 501 340 494 343 C500 351 498 359 490 363 C486 373 488 383 478 396 C464 410 440 415 424 418" fill="none" stroke="#9fd6ff" stroke-width="3" filter="url(#glow)"/>
    <!-- eye, lashes, brow -->
    <path d="M452 252 C462 246 474 246 482 252 C474 256 462 257 452 252 Z" fill="#0a0d14" stroke="#9fd6ff" stroke-opacity="0.8" stroke-width="1.5"/>
    <path d="M454 249 C466 241 478 242 486 248" fill="none" stroke="#dfeeff" stroke-width="2.2"/>
    <path d="M484 248 l7 -5" stroke="#dfeeff" stroke-width="1.8"/>
    <path d="M446 232 C460 224 476 224 488 230" fill="none" stroke="#6e8bb0" stroke-width="2.5" stroke-linecap="round"/>
    <!-- lips highlight -->
    <path d="M493 343 C490 346 486 348 482 348" stroke="#ff7aa8" stroke-opacity="0.7" stroke-width="2.5" fill="none"/>
    <!-- sleek hair: sharp bob with side-swept fringe -->
    <path d="M430 138 C360 110 268 140 248 255 C236 335 262 405 312 432 C340 446 360 430 364 404 C368 372 356 332 366 292 C378 246 420 222 476 210 C468 172 452 148 430 138 Z" fill="url(#hair)"/>
    <path d="M430 138 C452 148 468 172 476 210 C440 218 410 230 390 250" fill="none" stroke="#9fd6ff" stroke-opacity="0.65" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M300 170 C330 150 380 140 420 150" fill="none" stroke="#6e8bb0" stroke-opacity="0.5" stroke-width="2"/>
    <!-- earring -->
    <path d="M356 404 v18" stroke="#9fd6ff" stroke-width="1.5"/>
    <circle cx="356" cy="428" r="6" fill="#bfe6ff" filter="url(#glow)"/>
  </g>

  <!-- name block -->
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="720" y="300" font-size="86" font-weight="300" letter-spacing="22" fill="#f2f6ff">ANGELA</text>
    <rect x="724" y="328" width="440" height="1.5" fill="#5fb8ff" fill-opacity="0.6"/>
    <text x="724" y="372" font-size="22" letter-spacing="7" fill="#8fa6c6">AI NOTETAKER · WERKZET</text>
    <circle cx="733" cy="430" r="8" fill="#ff3b4a" filter="url(#glow)"/>
    <text x="752" y="438" font-size="20" letter-spacing="5" fill="#dfe8f7">RECORDING FOR MEETING NOTES</text>
  </g>
</svg>
